<?xml version="1.0" encoding="UTF-8"?>
<!--
  CONCEPT ARTWORK — not wired into any build.

  An app icon for the working name "Sidearm", explored 2026-08-09 while weighing a rename away
  from Vis Viva. Nothing here is live: `capacitor-assets generate` matches fixed filenames
  (icon-only / icon-foreground / icon-background / splash / splash-dark) directly in assets/ and
  does not recurse, so a file in this folder cannot reach a build by accident. Adopting it means
  rasterising it over assets/icon-only.png — the one hand-dropped master — and re-running
  scripts/build-icons.mjs, which derives the favicon, the in-app mark, the splash and android/res
  from it.

  The design is EVE's target-lock UI: chevrons converging on a locked ship, inside a segmented
  reticle ring. The centre glyph is the battlecruiser class bracket (hull + bar).

  Two constraints baked in, both of which the release pipeline enforces:
    * FULL-BLEED, NO ALPHA. The background rect covers the whole canvas. App Store Connect rejects
      an icon with an alpha channel, and .github/workflows/ios-testflight.yml fails the build on it.
    * 1024x1024, the marketing icon size the same workflow checks for.

  The ring is rotated 27 degrees on purpose. Its four gaps then fall between the chevrons and the
  axes, so nothing in the mark lines up with anything else and it reads as caught mid-sweep. At 0
  the gaps sit under the chevrons and at 45 they sit on the axes — both snap back to symmetric and
  the mark goes static. Keep it off both.

  Palette is the app's existing accent (#4f8ef7) and its light tint (#a8c8ff) on the UI's surface
  black (#0f0f10), so the mark sits with the current theme without a wider redesign.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="t d">
  <title id="t">Sidearm app icon concept</title>
  <desc id="d">A battlecruiser class bracket inside a segmented targeting ring, with four chevrons converging on it.</desc>

  <rect width="1024" height="1024" fill="#0f0f10"/>

  <!-- Reticle ring. dasharray 300/102 repeats exactly 4x around r=256 (circumference 1608.5);
       dashoffset 150 puts the gaps on the diagonals, then rotate(27) walks them off again. -->
  <circle cx="512" cy="512" r="256" fill="none" stroke="#4f8ef7" stroke-width="18"
          stroke-dasharray="300 102" stroke-dashoffset="150" stroke-linecap="round"
          opacity="0.85" transform="rotate(27 512 512)"/>

  <!-- Four chevrons, tips inward. Drawn once pointing -x and rotated into place. -->
  <g fill="none" stroke="#4f8ef7" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(45 512 512)"><path d="M876 448 L812 512 L876 576"/></g>
    <g transform="rotate(135 512 512)"><path d="M876 448 L812 512 L876 576"/></g>
    <g transform="rotate(225 512 512)"><path d="M876 448 L812 512 L876 576"/></g>
    <g transform="rotate(315 512 512)"><path d="M876 448 L812 512 L876 576"/></g>
  </g>

  <!-- Battlecruiser bracket: pentagon hull over a separate bar. -->
  <path d="M512 366 L628 494 V592 H396 V494 Z" fill="none" stroke="#a8c8ff" stroke-width="44" stroke-linejoin="round"/>
  <path d="M396 654 H628" fill="none" stroke="#a8c8ff" stroke-width="44" stroke-linecap="round"/>
</svg>
