name: CI

# Two gates:
#   test    — the pyfa-validated fit baselines (see CLAUDE.md before changing any expected value)
#   static  — the checks that would have caught the bugs shipped during the App.jsx split
#
# Deliberately NOT gating on full `eslint src`: the codebase has ~180 pre-existing style findings,
# and blocking every PR on those just teaches people to bypass CI. check-code.mjs fails only on
# runtime-fatal rules (no-undef and friends) and reports the rest.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pyfa regression baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install needed: the suite uses only Node built-ins + the committed data bundles.
      - run: node src/regression.test.mjs

      # Silent no-op detector: fails if a data regen (new EVE patch) introduces an empty-modifier
      # effect on a fittable type that isn't in the accepted baseline. See CLAUDE.md -> "Upgrading
      # eve.db". Self-contained — reads only the committed bundle, no pyfa/eos needed.
      - name: Effect coverage (no new silent no-ops)
        run: node scripts/check-effect-coverage.mjs

  static:
    name: lint / imports / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Runtime-fatal lint only. Two live ReferenceErrors (onExportFit, MT_ITEMS) sat in App.jsx
      # for months because nothing ran this.
      - name: Lint (runtime-fatal rules)
        run: node scripts/check-code.mjs

      # Catches broken import paths that `vite build` does NOT: @vite-ignore dynamic imports and
      # import.meta.glob patterns that silently match nothing. Both shipped as real bugs.
      - name: Check import paths
        run: node scripts/check-imports.mjs

      - name: Build
        run: npm run build

      # The shipped app runs offline from a webview. Fail if the build picks up a new remote
      # dependency (CDN font, analytics, image host) that would break with no network.
      - name: Check for network dependencies
        run: node scripts/check-offline.mjs
