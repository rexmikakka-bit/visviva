<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values; without it the
         insets are 0 and the bottom nav sits under the iPhone home indicator (and under Android's
         gesture bar). user-scalable=no suppresses the pinch-zoom that feels wrong in an app shell. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Axis</title>
    <!-- Boot screen. #root is empty until React mounts, and main.jsx defers that mount until the fit
         library has been read out of IndexedDB — so every load paints nothing for as long as that
         takes. On a cold web load the splash hides it, but Capacitor's splash covers COLD LAUNCH
         only, and importing a backup ends in window.location.reload(), which on a phone re-parses
         the whole bundle (the data files alone are ~5.8 MB) behind a blank white page.

         Inline, in <head>, and CSS-only on purpose: it has to be painted by the first frame, which
         rules out anything that waits on the module graph — including index.css, which in dev is
         injected by JS. Nothing removes it explicitly; it lives inside #root and React's first
         commit clears the container. -->
    <style>
      /* bg / border / accent, straight out of theme.js's two palettes. Duplicated because this has
         to work before any module has loaded — if those change, change them here too. */
      :root { --boot-bg:#0f0f10; --boot-track:#2e2e33; --boot-spin:#4f8ef7 }
      html.boot-light { --boot-bg:#f2f2f5; --boot-track:#d8d8de; --boot-spin:#2f6fe0 }
      #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
              background:var(--boot-bg) }
      #boot i { width:30px; height:30px; border-radius:50%; border:3px solid var(--boot-track);
                border-top-color:var(--boot-spin); animation:boot-spin .7s linear infinite }
      @keyframes boot-spin { to { transform:rotate(360deg) } }
      /* Still turns, just slowly — a frozen ring reads as "hung", which is the opposite of the point. */
      @media (prefers-reduced-motion:reduce) { #boot i { animation-duration:2.4s } }
    </style>
    <script>
      // Match the app's own theme so a light-theme user doesn't get a dark flash on every reload.
      // Same key and same "system" resolution as App.jsx; dark is the default there too.
      try {
        var p = localStorage.getItem('axis_theme_pref') || 'dark';
        if (p === 'system') p = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (p === 'light') document.documentElement.classList.add('boot-light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
