apply plugin: 'com.android.application'

// versionCode/versionName live in version.properties (tracked in git) instead of here, so
// `node scripts/bump-android-version.mjs` can bump them for a new test build without touching
// this file. versionCode must strictly increase or Android refuses to install over a previous copy.
def versionProps = new Properties()
def versionPropsFile = file('../version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps['versionCode'] ?: '1').toInteger()
def appVersionName = versionProps['versionName'] ?: '1.0'

// Play upload signing. key.properties holds a keystore path and three passwords in PLAINTEXT, so it
// is gitignored and never committed — this repo is public. Its ABSENCE is the normal case (CI, a
// fresh clone, anyone building a debug APK), so every reference below is guarded: without the file
// the project still configures and `assembleDebug` still works. An unsigned release build is the
// correct fallback — Play rejects it loudly, which is far better than a mystery failure here.
def keystorePropsFile = file('../key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasUploadKey = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace = "com.rexmikakka.visviva"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rexmikakka.visviva"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasUploadKey) {
                // Resolved against android/ (not android/app/), so a relative path in key.properties
                // means "next to key.properties". An absolute path pointing outside the repo also
                // works, and is the better place to keep the real keystore.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasUploadKey ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
